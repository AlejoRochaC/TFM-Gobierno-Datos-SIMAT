version: 2

models:
  - name: stg_estudiantes
    description: "Vista de estandarización de la información de estudiantes proveniente de la capa RAW."

    meta:
      owner: "Dirección de Cobertura y Equidad"
      steward: "Administrador funcional SIMAT"
      criticidad: "Alta"

    columns:

      - name: id_estudiante
        description: "Identificador único del estudiante."
        tests:
          - not_null
          - unique

      - name: tipo_documento
        description: "Tipo de documento del estudiante."

      - name: numero_documento
        description: "Número de documento."
        meta:
          dato_personal: true
        tests:
          - not_null

      - name: nombres
        description: "Nombres del estudiante."
        meta:
          dato_personal: true

      - name: apellidos
        description: "Apellidos del estudiante."
        meta:
          dato_personal: true

      - name: genero
        description: "Sexo registrado del estudiante."

      - name: fecha_nacimiento
        description: "Fecha de nacimiento."

      - name: codigo_sede
        description: "Código DANE de la sede educativa."

      - name: codigo_municipio
        description: "Código DANE del municipio."

      - name: codigo_etc
        description: "Entidad Territorial Certificada."